# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	    ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "tango"
BBFILE_PATTERN_tango = "^${LAYERDIR}/"
BBFILE_PRIORITY_tango = "5"

LAYERSERIES_COMPAT_tango = "wrynose"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_tango = "1"

LAYERDEPENDS_tango = "core"

# Rust 1.95.0 is provided by this layer (recipes-devtools/rust); override the
# weak default in tcmode-default.inc until openembedded-core ships it.
RUSTVERSION = "1.95.0%"
