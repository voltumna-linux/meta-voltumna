# vcontainer-sdk-x86-64.conf -- SDK build BASE (x86_64, no tools)
# ============================================================================
# The additive base for a vcontainer SDK build: x86_64, slimmed dom0, and NO
# tools included by default. Stack one or more tool add-ons on top of it:
#
#   require conf/distro/include/vcontainer-sdk-x86-64.conf        # base
#   require conf/distro/include/vcontainer-sdk-vdkr-x86-64.conf   # + docker
#   require conf/distro/include/vcontainer-sdk-vpdmn-x86-64.conf  # + podman
#   require conf/distro/include/vcontainer-sdk-vxn-x86-64.conf    # + vxn (Xen)
#   require conf/distro/include/vcontainer-sdk-aarch64.conf       # + arm64 runtime
#   # then: bitbake vcontainer-tarball
#
# Add only the lines you want -- e.g. base + vxn for the AXIS SDK, or base +
# vdkr + vpdmn for the docker/podman SDK with no vxn.
#
# This base OWNS BBMULTICONFIG (resets it, so the add-ons build it up cleanly) --
# use it in a build config dedicated to the SDK, not on top of a dev local.conf
# that needs other multiconfigs. Remove the require lines to restore.

BBMULTICONFIG = ""

VCONTAINER_ARCHITECTURES = "x86_64"
VCONTAINER_INCLUDE_VDKR  = "0"
VCONTAINER_INCLUDE_VPDMN = "0"
VCONTAINER_INCLUDE_VXN   = "0"
VXN_SLIM_DOM0            = "1"
