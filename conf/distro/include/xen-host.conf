# Xen host configuration fragment
#
# Include from local.conf for Xen Dom0 development and testing.
# Requires meta-virt-host.conf to be included first:
#
#   require conf/distro/include/meta-virt-host.conf
#   require conf/distro/include/xen-host.conf
#   MACHINE = "qemux86-64"
#   bitbake xen-image-minimal
#
# Enables Xen hypervisor support ONLY -- a Xen host does not imply vxn. For vxn
# (Docker-CLI-for-Xen) tooling on the dom0, require vxn-host.conf instead (it
# pulls this fragment in). The vxn SDK dom0 flavors come from the vxn-*
# multiconfigs and do not need this fragment.

DISTRO_FEATURES:append = " xen"
