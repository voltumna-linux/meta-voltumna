# vcontainer-sdk-vpdmn-x86-64.conf -- add vpdmn (Podman) for x86_64
# ============================================================================
# Stack on top of vcontainer-sdk-x86-64.conf to include vpdmn (the Podman CLI in
# a QEMU vruntime VM). Shares the vruntime-x86-64 MC with vdkr -- requiring both
# is fine (the duplicate MC entry is harmless).

BBMULTICONFIG += "vruntime-x86-64"
VCONTAINER_INCLUDE_VPDMN = "1"
