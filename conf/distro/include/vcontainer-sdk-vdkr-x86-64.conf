# vcontainer-sdk-vdkr-x86-64.conf -- add vdkr (Docker) for x86_64
# ============================================================================
# Stack on top of vcontainer-sdk-x86-64.conf to include vdkr (the Docker CLI in
# a QEMU vruntime VM). Shares the vruntime-x86-64 MC with vpdmn -- requiring both
# is fine (the duplicate MC entry is harmless).

BBMULTICONFIG += "vruntime-x86-64"
VCONTAINER_INCLUDE_VDKR = "1"
