# vcontainer-sdk-vxn-x86-64.conf -- add vxn (Xen dom0) for x86_64
# ============================================================================
# Stack on top of vcontainer-sdk-x86-64.conf to include vxn (Docker-for-Xen: the
# container runs as a Xen PV DomU under a dom0 booted via QEMU). base + this line
# alone is the minimal AXIS SDK (`axis run --policy vxn -- <tool>`).

BBMULTICONFIG += "vxn-x86-64"
VCONTAINER_INCLUDE_VXN = "1"
