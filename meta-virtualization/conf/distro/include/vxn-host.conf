# vxn host configuration fragment
#
# Xen + vxn (Docker-CLI-for-Xen) on the dom0. Layered on top of xen-host.conf
# (which it requires) so "Xen host" and "vxn host" stay decoupled: require
# xen-host.conf for a plain Xen dom0, or this for a Xen dom0 that also carries
# the vxn tooling + OCI runtime path.
#
#   require conf/distro/include/meta-virt-host.conf
#   require conf/distro/include/vxn-host.conf
#   MACHINE = "qemux86-64"
#   bitbake xen-image-minimal
#
# Note: the vxn SDK dom0 blobs are built by the vxn-* multiconfigs, which set
# these same features themselves -- they do not depend on this fragment. This is
# only for a vxn-enabled dom0 in the main config.

require conf/distro/include/xen-host.conf

# vxn DISTRO_FEATURE gates the vxn kernel config (linux-yocto vxn.cfg).
DISTRO_FEATURES:append = " vxn"

# Xen Dom0 image packages: vxn tooling + containerd for the OCI runtime path.
IMAGE_INSTALL:append:pn-xen-image-minimal = " vxn containerd-opencontainers"
