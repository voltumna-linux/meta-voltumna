# vcontainer-sdk-vxn-podman-x86-64.conf -- add the podman-flavored vxn dom0 blob
# ============================================================================
# Stack on top of vcontainer-sdk-vxn-x86-64.conf. That profile ships the docker
# dom0 blob; this one adds a second dom0 blob built with podman instead of
# docker-moby. The SDK then carries BOTH (xen-dom0-docker.wic +
# xen-dom0-podman.wic); boot-xen.sh picks one at launch (--flavor / VXN_DOM0_FLAVOR).

BBMULTICONFIG += "vxn-podman-x86-64"
VXN_DOM0_FLAVORS = "docker podman"
