# vcontainer-sdk-aarch64.conf -- add the aarch64 (arm64) runtime
# ============================================================================
# Stack on top of the base + a runtime tool (vdkr and/or vpdmn) to also build
# their aarch64 VMs, so the SDK can run arm64 container workloads on an x86 host
# under qemu-system-aarch64. This adds the aarch64 architecture across the board:
# the vdkr/vpdmn arm64 blobs, the qemu-system-aarch64 target, and the aarch64
# EDK2 firmware all follow VCONTAINER_ARCHITECTURES.
#
# vxn itself has no aarch64 multiconfig yet (x86_64 dom0 only), so this only
# affects the vdkr/vpdmn runtime tools.

BBMULTICONFIG += "vruntime-aarch64"
VCONTAINER_ARCHITECTURES:append = " aarch64"
