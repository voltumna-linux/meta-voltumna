#
# Multiconfig for the vxn Xen dom0 image (docker flavor; packaged into the
# vcontainer SDK as xen-dom0-docker.wic).
#
# Opt-in: only referenced when VCONTAINER_INCLUDE_VXN = "1" and this
# multiconfig is added to BBMULTICONFIG. vxn is more niche than vdkr/vpdmn, so
# it is not part of the standalone tarball by default.
#
# Builds xen-image-minimal as a QEMU-bootable Xen dom0 with vxn:
#   - XEN_BOOT_MODE=bios       boots under QEMU via SeaBIOS -> syslinux -> Xen
#   - XEN_DOM0_NETWORK=nat      dom0 is a NAT router for the DomU guests
#   - no bundled guests         vxn pulls guest images at runtime over the NAT
#                               network, keeping the blob small
#
#   bitbake mc:vxn-x86-64:xen-image-minimal
#
# Only MACHINE, TMPDIR, and the engine IMAGE_INSTALL differ from the podman
# flavor; everything else lives in vxn-dom0-common.inc.

MACHINE = "qemux86-64"
TMPDIR = "${TOPDIR}/tmp-vxn-x86-64"

require conf/distro/include/vxn-dom0-common.inc

# vxn tooling + the container engines that drive vxn-oci-runtime in the dom0:
#   - containerd-opencontainers: the vctr / `ctr --runtime io.containerd.vxn.v2` path
#   - docker-moby + vxn-docker-config: native `docker run` -> vxn-oci-runtime, and
#     the vexpose docker API (Mode 2). docker-moby only (NOT podman) -- both own
#     /usr/bin/docker and would collide at do_rootfs.
IMAGE_INSTALL:append:pn-xen-image-minimal = " vxn containerd-opencontainers docker-moby vxn-docker-config"

# vdkr/vpdmn Dom0 frontends: bash CLIs (/usr/bin/vdkr, /usr/bin/vpdmn) that
# auto-detect Xen and drive vxn. RDEPENDS only ${PN}+bash -- no docker/podman
# dep, no file conflict -- so they slot into this docker dom0 for free (and let
# the vdkr/vpdmn xen tests run against the same image).
IMAGE_INSTALL:append:pn-xen-image-minimal = " vxn-vdkr vxn-vpdmn"
