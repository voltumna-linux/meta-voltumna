#
# Multiconfig for the *podman-flavored* vxn Xen dom0 image (packaged into the
# vcontainer SDK as xen-dom0-podman.wic).
#
# Identical to vxn-x86-64.conf except the dom0 ships podman (+ vxn-podman-config)
# instead of docker-moby. docker-moby and podman both own /usr/bin/docker and
# cannot coexist in one rootfs, so the two engine flavors are separate dom0
# images -- selected at launch time by boot-xen.sh (--flavor / VXN_DOM0_FLAVOR).
#
# Its own TMPDIR keeps its deploy artifacts distinct from the docker flavor's.
#
#   bitbake mc:vxn-podman-x86-64:xen-image-minimal
#
# Only MACHINE, TMPDIR, and the engine IMAGE_INSTALL differ from the docker
# flavor; everything else lives in vxn-dom0-common.inc.

MACHINE = "qemux86-64"
TMPDIR = "${TOPDIR}/tmp-vxn-podman-x86-64"

require conf/distro/include/vxn-dom0-common.inc

# vxn tooling + podman as the container engine driving vxn-oci-runtime:
#   - podman + vxn-podman-config: native `podman run` -> vxn-oci-runtime.
#     podman only (NOT docker-moby) -- both own /usr/bin/docker and collide at
#     do_rootfs. This is the whole reason the podman flavor is a separate dom0.
IMAGE_INSTALL:append:pn-xen-image-minimal = " vxn podman vxn-podman-config"

# Enable podman's optional ca-certs packageconfig for THIS dom0 only, so the
# podman engine can verify TLS when pulling from public registries. podman's
# global default stays off (no hard dep); this is a per-config opt-in.
PACKAGECONFIG:append:pn-podman = " ca-certs"
