# Xen PV guest support for vxn (vcontainer on Xen)
# These configs enable a kernel to run as a Xen PV or PVHVM guest
# with virtio-equivalent functionality via Xen paravirtualized drivers.

# Core Xen guest support
CONFIG_XEN=y
CONFIG_XEN_PV=y
CONFIG_XEN_PVHVM=y

# Block device frontend (guest sees /dev/xvd*)
CONFIG_XEN_BLKDEV_FRONTEND=y

# Network frontend (guest sees eth0 via xennet)
CONFIG_XEN_NETDEV_FRONTEND=y

# PV console (guest sees /dev/hvc0, /dev/hvc1)
CONFIG_HVC_XEN=y
CONFIG_HVC_XEN_FRONTEND=y

# Framebuffer frontend: a vxn DomU is headless (console = hvc0), so the Xen
# framebuffer frontend is dead weight -- drop it to trim probe/init on the boot
# path. Re-enable only if a graphical DomU is ever needed.
# CONFIG_XEN_FBDEV_FRONTEND is not set

# 9pfs Xen transport (base 9p stack comes from cfg/container.scc via vcontainer)
CONFIG_NET_9P_XEN=y
