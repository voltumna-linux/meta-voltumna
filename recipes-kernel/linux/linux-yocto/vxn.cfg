# Xen PV guest support for vxn (vcontainer on Xen)
# These configs enable a kernel to run as a Xen PV or PVHVM guest
# with virtio-equivalent functionality via Xen paravirtualized drivers.

# Core Xen guest support
CONFIG_XEN=y
CONFIG_XEN_PV=y
CONFIG_XEN_PVHVM=y

# PVH guest support (x86-only symbol). Lets the SAME kernel boot as either PV or
# PVH; the guest type is chosen at launch via VXN_DOMU_TYPE (default pv on x86).
# XEN_PV and XEN_PVH coexist in one kernel. On arm64 all Xen guests are PVH-style
# under CONFIG_XEN already, so no equivalent symbol is needed there.
CONFIG_XEN_PVH=y

# PCI passthrough plumbing so a passed-through device (e.g. an SR-IOV VF) is
# visible inside the DomU. PV guests reach it via the Xen PCI frontend
# (xen-pcifront); PVH guests use native PCI (MMCONFIG). The device-specific VF
# driver (iavf / ixgbevf / mlx5_core / ...) is deliberately NOT enabled here --
# add it per deployment. Functional passthrough also needs a passthrough-capable
# Xen + dom0 setup (IOMMU, xen-pciback); see docs/vxn.md.
CONFIG_PCI=y
CONFIG_XEN_PCIDEV_FRONTEND=y
CONFIG_PCI_MMCONFIG=y

# Block device frontend (guest sees /dev/xvd*)
CONFIG_XEN_BLKDEV_FRONTEND=y

# Network frontend (guest sees eth0 via xennet)
CONFIG_XEN_NETDEV_FRONTEND=y

# PV console (guest sees /dev/hvc0, /dev/hvc1)
CONFIG_HVC_XEN=y
CONFIG_HVC_XEN_FRONTEND=y

# Framebuffer frontend: a vxn DomU is headless (console = hvc0), so the Xen
# framebuffer frontend is dead weight -- drop it to trim probe/init on the boot
# path. Re-enable only if a graphical DomU is ever needed.
# CONFIG_XEN_FBDEV_FRONTEND is not set

# 9pfs Xen transport (base 9p stack comes from cfg/container.scc via vcontainer)
CONFIG_NET_9P_XEN=y
